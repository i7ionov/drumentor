[package]
name = "drumentor"
version = "0.1.1"
description = "Desktop drum learning app"
authors = ["Drumentor"]
edition = "2021"

[lib]
name = "drumentor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Windows ASIO via cpal. Requires Steinberg ASIO SDK (`CPAL_ASIO_DIR`) at build time.
asio = ["cpal/asio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
midly = "0.5"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
oxisynth = { version = "0.1", features = ["sf3"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
